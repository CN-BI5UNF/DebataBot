id: deepseek
display_name: DeepSeek
protocol: openai_compat
base_url: https://api.deepseek.com/v1
registration_url: https://platform.deepseek.com
reasoning_effort_style: deepseek
reasoning_style: thinking_extra_body
reasoning_effort_options: [low, high, max]
image_token_reserve: 384
image_detail_supported: false
# 官方视觉文档只展示 image_url.url；每图按 384 token 预算预留。
# 官方 Search API 是 provider 级独立接口，不绑定聊天模型。
search_channel: deepseek_tools_search
search_label: DeepSeek Search（provider 级）
search_payload:
  request:
    need_content: true

models:
  - id: deepseek-flash
    display_name: DeepSeek V4 Flash（推荐 · 1M 上下文）
    capabilities: [chat, tool_call, reasoning, vision]
    context_length: 1000000

  - id: deepseek-v4-pro
    display_name: DeepSeek V4 Pro（重推理）
    capabilities: [chat, tool_call, reasoning]
    context_length: 1000000

  # 以下两个 legacy ID 在 DeepSeek 官方 2026-07-24 后已停用，仅用于历史配置兼容。
  - id: deepseek-chat
    display_name: DeepSeek Chat（legacy，已停用）
    capabilities: [chat, tool_call, reasoning]
    context_length: 128000

  - id: deepseek-reasoner
    display_name: DeepSeek Reasoner（legacy，已停用）
    capabilities: [chat, tool_call, reasoning]
    context_length: 128000
